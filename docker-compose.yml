version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: liana
      POSTGRES_USER: liana
      POSTGRES_PASSWORD: ${DB_PASSWORD:-liana_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - liana_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liana"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://liana:${DB_PASSWORD:-liana_secret_password}@postgres:5432/liana
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-min-32-chars!!}
      UPLOAD_DIR: /app/uploads
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-30}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-500}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      ENVIRONMENT: production
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - liana_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    networks:
      - liana_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads_data:/app/uploads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - liana_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  liana_network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
